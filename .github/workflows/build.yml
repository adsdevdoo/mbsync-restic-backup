# Tests on every push and pull request; on main and v* tags also builds the image for amd64 and arm64 and pushes it
# to ghcr.io/<owner>/mbsync-restic-backup and, when the repository variable DOCKERHUB_USERNAME and the secret
# DOCKERHUB_TOKEN are set, to docker.io/<DOCKERHUB_USERNAME>/mbsync-restic-backup.
# Tags: the full commit SHA (deployments pin it), latest (main), and x.y.z / x.y for a vx.y.z tag.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests (stub mbsync, no mailbox)
        run: sh tests/test.sh

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/mbsync-restic-backup,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test both platforms
        run: |
          for p in linux/amd64 linux/arm64; do
            docker run --rm --platform "$p" --entrypoint sh "ghcr.io/${{ github.repository }}:${{ github.sha }}" \
              -c 'mbsync -v && restic version && rsync --version | head -1 && gawk --version | head -1'
          done
