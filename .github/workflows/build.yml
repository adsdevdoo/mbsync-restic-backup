# Tests on every push and pull request; on main and v* tags also builds the image for amd64 and arm64 and pushes it
# to ghcr.io/<owner>/mbsync-restic-backup and, when the repository variable DOCKERHUB_USERNAME and the secret
# DOCKERHUB_TOKEN are set, to docker.io/<DOCKERHUB_USERNAME>/mbsync-restic-backup.
# Tags (as most projects do):
#   vX.Y.Z git tag -> X.Y.Z, X.Y; X (X >= 1) if highest in its major line; latest if highest overall; and a
#                     GitHub Release with the CHANGELOG.md section
#   main           -> edge
#   every build    -> sha-<short> and the full commit SHA (deployments pin it)
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests (stub mbsync, no mailbox)
        run: sh tests/test.sh

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A release tag moves latest and X only if it is the highest version (overall / in its major line), so a
      # hotfix tagged on an older line never pulls them back.
      - name: Is this the highest release?
        id: rel
        run: |
          top=yes; top_major=yes
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            v="${GITHUB_REF_NAME#v}"
            [ "$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- - | head -1)" = "$GITHUB_REF_NAME" ] || top=no
            [ "$(git tag --list "v${v%%.*}.*" --sort=-v:refname | grep -v -- - | head -1)" = "$GITHUB_REF_NAME" ] || top_major=no
          fi
          echo "top=$top" >>"$GITHUB_OUTPUT"
          echo "top_major=$top_major" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/mbsync-restic-backup,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          # latest: release tags only (never main), and only the highest version (see the step above).
          flavor: |
            latest=${{ steps.rel.outputs.top == 'yes' && 'auto' || 'false' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') && steps.rel.outputs.top_major == 'yes' }}
            type=edge,branch=main
            type=sha,prefix=sha-
            type=sha,format=long,prefix=
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test both platforms
        run: |
          for p in linux/amd64 linux/arm64; do
            docker run --rm --platform "$p" --entrypoint sh "ghcr.io/${{ github.repository }}:${{ github.sha }}" \
              -c 'mbsync -v && restic version && rsync --version | head -1 && gawk --version | head -1'
          done
      # Needs a Docker Hub token allowed to edit the repository (Read, Write, Delete); with a narrower token this
      # step fails without failing the build.
      - name: Docker Hub description from README
        if: env.DOCKERHUB_USERNAME != '' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/mbsync-restic-backup
          short-description: "Daily IMAP mailbox backup: mbsync (pull-only Maildir) + restic snapshots, amd64/arm64"
          readme-filepath: ./README.md
          enable-url-completion: true

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" { on = 1; next } /^## \[/ || /^\[/ { on = 0 } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
